# tmux.conf by toilavinh.dev
# https://github.com/toilavinhdev/.dotfiles/blob/master/tmux/.tmux.conf

# -- config ----------------------------------------------------------
# user options (@name) work like constants: read them with show-option in
# scripts or #{@name} in formats/styles

# colors
set -g @color-primary "#ffa040" # accent (orange)
set -g @color-dark    "#1e1e2e" # dark background / text on accent
set -g @color-muted   "#6c7086" # inactive text, bell indicator
set -g @color-border  "#45475a" # pane borders, status divider (dimmer than muted)
set -g @color-white   "#cdd6f4" # main text
set -g @color-command "blue"    # command mode badge
set -g @color-copy    "red"     # copy mode badge
set -g @color-zoom    "magenta" # zoom badge

# popup size
set -g @popup-width   "80%"
set -g @popup-height  "80%"

# -- general ----------------------------------------------------------

# enable mouse
set -g mouse on
set -g set-clipboard on

# performance
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on

# window, pane ordering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# rename window to dir instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# auto-name unnamed sessions as tmux:0, tmux:1, ...
# note: ':' is not allowed in tmux session names, so the real name becomes tmux_0
set-hook -g session-created 'if-shell -F "#{m/r:^[0-9]+$,#{session_name}}" "run-shell \"tmux rename-session -t #{session_name} tmux_#{session_name}\""'

# -- key binding ------------------------------------------------------

# prefix key
# unbind C-b
set -g prefix C-b
bind C-b send-prefix

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# system
bind : command-prompt
bind ? list-keys

# enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# session
bind s choose-tree -s
bind d detach-client
bind $ command-prompt -I "#S" "rename-session '%%'"

# window
bind w choose-tree -w
bind c new-window -a -c "#{pane_current_path}"
bind n next-window
bind p previous-window
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
unbind %
bind - split-window -v -c "#{pane_current_path}"

# pane
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r z resize-pane -Z

# notifications
setw -g monitor-bell on
set -g bell-action other # only monitor bells in windows not currently open
setw -g window-status-bell-style "fg=#{@color-muted} underscore"

# -- display ----------------------------------------------------------

# true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

# message
set -g message-style "bg=#{@color-primary},fg=#{@color-dark}"

# status bar
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#{@color-muted}"
set -g status 2
set -gu status-format
set -g 'status-format[0]' '#[align=left]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index}]#{T:window-status-current-format}#[norange default]#{?window_end_flag,,#{window-status-separator}}}#[align=right]#{T:status-right}'
set -g 'status-format[1]' '#[fg=#{@color-border}]#{s/ /─/:#{p300:}}'

# left status bar
set -g status-left ""
set -g status-left-length 20

# right status bar
set -g @mode_cmd    "#{?client_prefix,#[bg=#{@color-command}#,fg=#{@color-white}#,bold] COMMAND #[default],}"
set -g @mode_copy   "#{?client_prefix,,#{?pane_in_mode,#[bg=#{@color-copy}#,fg=#{@color-white}#,bold] MODE #[default],}}"
set -g @mode_normal "#{?client_prefix,,#{?pane_in_mode,,#[bg=#{@color-primary}#,fg=#{@color-dark}#,bold] #{?#{m/r:^tmux_,#{session_name}},tmux:#{s|^tmux_||:session_name},#{session_name}} #[default]}}"
set -g @mode_zoom   "#{?window_zoomed_flag, #[bg=#{@color-zoom}#,fg=#{@color-white}#,bold] ZOOM #[default],}"
set -g @host  "#[fg=#{@color-white}]#h"
set -g @clock "#[fg=#{@color-white}]%Y-%m-%d %H:%M"
set -g status-right "#{E:@mode_cmd}#{E:@mode_copy}#{E:@mode_normal}#{E:@mode_zoom} #{T:@host} #{T:@clock} "
set -g status-right-length 100

# window
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@color-muted}] #I: #{=/24/...:#{b:pane_current_path}} "
set -g window-status-current-format "#[bg=#{@color-primary},fg=#{@color-dark},bold] #I: #{=/24/...:#{b:pane_current_path}} #[default]"

# pane
set -g pane-border-style "fg=#{@color-border}"
set -g pane-active-border-style "fg=#{@color-primary}"

# menu
# popups share one session ("popup"), one window per tool
# closing hides them, reopening restores the same process
# (the same entry inside the popup hides it, another entry switches window)
# hide the current popup (no-op outside a popup)
bind -T prefix Tab run-shell '~/.config/tmux/scripts/popup.sh --close "#{session_name}"'
bind e display-menu -x C -y C \
  "shell"               s       "run-shell '~/.config/tmux/scripts/popup.sh shell'" \
  "git"                 g       "run-shell '~/.config/tmux/scripts/popup.sh git lazygit'" \
  "docker"              d       "run-shell '~/.config/tmux/scripts/popup.sh docker lazydocker'" \
  "tmux"                t       "run-shell '~/.config/tmux/scripts/popup.sh tmux vi ~/.config/tmux/tmux.conf'" \
  "exit"                q       ""

# -- plugins ----------------------------------------------------------

# global
set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.config/tmux/plugins/'

# local variables
set -g @tpm_path '$HOME/.config/tmux/plugins/tpm'

# clone TPM if not exists
if-shell 'test ! -f "#{@tpm_path}/tpm"' {
  run 'git clone https://github.com/tmux-plugins/tpm "#{@tpm_path}"'
}

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '#{@tpm_path}/tpm'