# https://github.com/toilavinhdev/.dotfiles/blob/master/tmux/.tmux.conf

# -- general ----------------------------------------------------------

# enable mouse
set -g mouse on
set -g set-clipboard on

# performance
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on

# window, pane ordering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# rename window to dir instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# -- key binding ------------------------------------------------------

# prefix key
# unbind C-b
set -g prefix C-b
bind C-b send-prefix

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# system
bind : command-prompt
bind ? list-keys

# enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# session
bind s choose-tree -s
bind d detach-client
bind $ command-prompt -I "#S" "rename-session '%%'"

# window
bind w choose-tree -w
bind c new-window -a -c "#{pane_current_path}"
bind n next-window
bind p previous-window
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
unbind %
bind - split-window -v -c "#{pane_current_path}"

# pane
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r z resize-pane -Z

# notifications
setw -g monitor-bell on
set -g bell-action other # only monitor bells in windows not currently open
setw -g window-status-bell-style 'fg=#787487 underscore'

# -- display ----------------------------------------------------------

# true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

# message
set -g message-style "bg=#ffa040,fg=#1e1e2e"

# status bar
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#6c7086"
set -g status 2
set -gu status-format
set -g 'status-format[0]' '#[align=left]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index}]#{T:window-status-current-format}#[norange default]#{?window_end_flag,,#{window-status-separator}}}#[align=right]#{T:status-right}'
set -g 'status-format[1]' '#[fg=#45475a]#{s/ /─/:#{p300:}}'


# left status bar
set -g status-left ""
set -g status-left-length 20

# right status bar
set -g @mode_cmd    "#[bg=blue#,fg=white#,bold] COMMAND #[default]"
set -g @mode_copy   "#[bg=red#,fg=white#,bold] MODE #[default]"
set -g @mode_normal "#[bg=#ffa040#,fg=#1e1e2e#,bold] NORMAL #[default]"
set -g @mode_zoom   "#[bg=magenta#,fg=white#,bold] ZOOM #[default]"
set -g @host  "#h"
set -g @clock "%Y-%m-%d %H:%M"
set -g status-right "#{?client_prefix,#{E:@mode_cmd},#{?pane_in_mode,#{E:@mode_copy},#{E:@mode_normal}}}#{?window_zoomed_flag, #{E:@mode_zoom},} #[fg=#cdd6f4]#{T:@host} #{T:@clock} "
set -g status-right-length 100

# window
set -g window-status-separator " "
set -g window-status-format "#[fg=#6c7086] #I: #{=/24/...:#{b:pane_current_path}} "
set -g window-status-current-format "#[bg=#ffa040,fg=#1e1e2e,bold] #I: #{=/24/...:#{b:pane_current_path}} #[default]"

# pane
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#ffa040"

# menu
bind e display-menu -T "#[align=centre]🐈" -x C -y C \
  "shell"               s       "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'zsh'" \
  "git"                 g       "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'lazygit'" \
  "docker"              d       "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'lazydocker'" \
  "tmux"                t       "display-popup -E -w 80% -h 80% 'vi ~/.config/tmux/tmux.conf'" \
  "exit"                q       ""

# -- plugins ----------------------------------------------------------

# global
set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.config/tmux/plugins/'

# local variables
set -g @tpm_path '$HOME/.config/tmux/plugins/tpm'

# clone TPM if not exists
if-shell 'test ! -f "#{@tpm_path}/tpm"' {
  run 'git clone https://github.com/tmux-plugins/tpm "#{@tpm_path}"'
}

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '#{@tpm_path}/tpm'